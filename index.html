<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDLC First-Principles Canvas</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root{
  --bg:#ffffff; --fg:#1d1d1f; --muted:#6b6b70; --border:#e5e5e8;
  --code-bg:#f6f6f7; --accent:#9a3b2e; --link:#2563eb; --th-bg:#f2f2f4;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1a1a1c; --fg:#e8e8ea; --muted:#a0a0a6; --border:#34343a;
    --code-bg:#242428; --accent:#e0a08f; --link:#7aa2f7; --th-bg:#26262b; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.7;}
.wrap{max-width:920px;margin:0 auto;padding:32px 24px 96px;}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:8px;flex-wrap:wrap;}
header.top h1{font-size:24px;margin:0;font-weight:600;}
.bar{display:flex;align-items:center;gap:12px;}
.meta{color:var(--muted);font-size:13px;}
button#refresh{font:inherit;font-size:13px;color:var(--muted);background:var(--code-bg);
  border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer;}
button#refresh:hover{color:var(--fg);}
#toc{border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin:20px 0 28px;
  background:var(--code-bg);}
#toc strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin-bottom:8px;}
#toc ol{margin:0;padding-left:18px;}
#toc a{color:var(--link);text-decoration:none;}
#toc a:hover{text-decoration:underline;}
#content h1{font-size:23px;margin:34px 0 12px;}
#content h2{font-size:19px;margin:36px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
#content h3{font-size:16px;margin:24px 0 8px;}
#content p{margin:12px 0;}
#content a{color:var(--link);}
#content code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--code-bg);padding:.12em .4em;border-radius:5px;font-size:.9em;}
#content pre{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;overflow-x:auto;line-height:1.45;}
#content pre code{background:none;padding:0;font-size:13px;white-space:pre;}
#content blockquote{margin:14px 0;padding:6px 16px;border-left:3px solid var(--accent);
  color:var(--muted);background:var(--code-bg);border-radius:0 8px 8px 0;}
#content table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14.5px;
  display:block;overflow-x:auto;}
#content th,#content td{border:1px solid var(--border);padding:8px 12px;
  text-align:left;vertical-align:top;}
#content th{background:var(--th-bg);font-weight:600;}
#content ul,#content ol{padding-left:24px;}
#content li{margin:5px 0;}
#content hr{border:none;border-top:1px solid var(--border);margin:28px 0;}
.err{color:var(--accent);font-size:14px;}
h2[id],h3[id]{scroll-margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>SDLC First-Principles Canvas</h1>
    <div class="bar">
      <span class="meta">live &middot; rendered from <code>sdlc-first-principles-canvas.md</code></span>
      <button id="refresh" title="Re-fetch the living document">&#8635; refresh</button>
    </div>
  </header>
  <div id="toc"></div>
  <div id="content"><p class="meta">Loading&hellip;</p></div>
</div>
<script>
const MD = 'sdlc-first-principles-canvas.md';
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');}
function buildTOC(){
  const c = document.getElementById('content');
  const heads = Array.from(c.querySelectorAll('h2, h3'));
  const toc = document.getElementById('toc');
  if(!heads.length){ toc.style.display='none'; return; }
  const ol = document.createElement('ol');
  heads.forEach(function(h){
    if(!h.id) h.id = slug(h.textContent);
    const li = document.createElement('li');
    if(h.tagName === 'H3') li.style.marginLeft = '14px';
    const a = document.createElement('a');
    a.href = '#' + h.id; a.textContent = h.textContent;
    li.appendChild(a); ol.appendChild(li);
  });
  toc.innerHTML = '<strong>Contents</strong>';
  toc.appendChild(ol);
}
async function render(){
  try{
    const r = await fetch(MD, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const md = await r.text();
    if(!window.marked) throw new Error('markdown renderer failed to load');
    document.getElementById('content').innerHTML = marked.parse(md);
    buildTOC();
  }catch(e){
    document.getElementById('content').innerHTML =
      '<p class="err">Could not render the document: ' + e.message + '</p>';
  }
}
document.getElementById('refresh').addEventListener('click', render);
render();
</script>
</body>
</html>
